name: drift-monitor

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: "Path (inside the checkout) to a CSV/parquet with a real batch of records to check for drift."
        required: true
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (the lean API deps cover what monitor.py imports)
        run: pip install --no-cache-dir -r requirements-api.txt

      - name: Run drift monitor
        run: python -m src.run_monitor --batch "${{ github.event.inputs.batch_path }}"
