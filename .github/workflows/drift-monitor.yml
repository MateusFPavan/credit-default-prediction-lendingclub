name: drift-monitor

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: "Caminho (dentro do checkout) para um CSV/parquet com um lote real de registros pra checar drift."
        required: true
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (lean API deps ja cobrem o que monitor.py importa)
        run: pip install --no-cache-dir -r requirements-api.txt

      - name: Run drift monitor
        run: python -m src.run_monitor --batch "${{ github.event.inputs.batch_path }}"
