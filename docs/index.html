<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Default Risk — Turning Approvals into a Profit Decision</title>
<style>
  :root{
    --ink:#0E2A47;        /* deep navy ink */
    --ink-2:#1B3A5B;
    --slate:#5A7391;      /* muted slate for secondary */
    --mist:#8FA3BC;       /* light labels */
    --paper:#F7F8FA;      /* page */
    --card:#FFFFFF;
    --line:#E4E9F0;       /* hairline */
    --gain:#1E7A56;       /* dessaturated green */
    --cost:#B03A2E;       /* dessaturated red */
    --accent:#C8912E;     /* brass accent — credit ledger warmth */
    --stable:#1E7A56;
    --watch:#C8912E;
    --unstable:#B03A2E;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:Georgia,"Times New Roman",serif;
    background:var(--paper); color:var(--ink);
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  /* ---- Hero ---- */
  header.hero{
    background:var(--ink); color:#fff; padding:76px 0 64px;
    border-bottom:3px solid var(--accent);
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--accent); margin-bottom:20px;
  }
  h1{
    font-size:clamp(30px,5vw,52px); line-height:1.12; font-weight:400;
    letter-spacing:-.01em; max-width:16ch;
  }
  .hero p.lead{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:18px; color:#B9C7DA; margin-top:22px; max-width:60ch; line-height:1.65;
  }
  .hero-figure{
    margin-top:44px; display:grid; grid-template-columns:auto 1fr; gap:28px;
    align-items:center; border-top:1px solid rgba(255,255,255,.14); padding-top:34px;
  }
  .bignum{font-size:clamp(44px,7vw,72px); font-weight:400; letter-spacing:-.02em; color:#fff}
  .bignum .unit{font-size:.5em; color:var(--accent)}
  .hero-figure .cap{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:14px; color:#B9C7DA; line-height:1.6;
  }
  .hero-figure .cap b{color:#fff;font-weight:600}

  /* ---- Section scaffolding ---- */
  section{padding:72px 0; border-bottom:1px solid var(--line)}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
  .sec-num{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.1em}
  h2{font-size:clamp(24px,3.4vw,34px);font-weight:400;letter-spacing:-.01em;line-height:1.2}
  .sec-sub{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;color:var(--slate);margin:14px 0 40px;max-width:64ch;line-height:1.65;
  }

  /* ---- KPI row ---- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .kpi{background:var(--card);padding:26px 22px}
  .kpi .v{font-size:34px;font-weight:400;letter-spacing:-.01em;color:var(--ink)}
  .kpi .l{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist);margin-top:8px}
  .kpi .sub{font-family:-apple-system,sans-serif;font-size:13px;color:var(--slate);margin-top:6px}

  /* ---- Card / grid ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px}
  .card h3{font-size:19px;font-weight:400;margin-bottom:6px}
  .card .note{font-family:-apple-system,sans-serif;font-size:13.5px;color:var(--slate);margin-bottom:22px;line-height:1.6}

  /* ---- Confusion matrix ---- */
  .cm{display:grid;grid-template-columns:auto 1fr 1fr;grid-auto-rows:auto;gap:6px;font-family:-apple-system,sans-serif}
  .cm .axis{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mist);
    display:flex;align-items:center;justify-content:center;text-align:center}
  .cm .cell{border-radius:8px;padding:18px 14px;text-align:center;color:#fff}
  .cm .cell .cn{font-size:26px;font-weight:600;font-family:Georgia,serif}
  .cm .cell .ct{font-size:11.5px;opacity:.92;margin-top:6px;line-height:1.35}
  .cm .good{background:var(--gain)}
  .cm .bad{background:var(--cost)}
  .cm .rowlab{font-size:12px;color:var(--slate);display:flex;align-items:center;justify-content:flex-end;
    padding-right:10px;text-align:right;font-weight:600}

  /* ---- Waterfall (CSS bars) ---- */
  .wf{display:flex;align-items:flex-end;gap:24px;padding-top:10px}
  .wf .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .wf .wfslot{width:100%;height:220px;position:relative;display:flex;align-items:flex-end}
  .wf .bar{width:100%;border-radius:6px 6px 0 0;position:absolute;left:0;height:0;
    transition:height .9s cubic-bezier(.2,.7,.3,1),bottom .9s cubic-bezier(.2,.7,.3,1)}
  .wf .val{font-family:Georgia,serif;font-size:16px;margin-bottom:8px;color:var(--ink);font-weight:600}
  .wf .lab{font-family:-apple-system,sans-serif;font-size:12.5px;color:var(--slate);margin-top:10px;text-align:center}

  /* ---- PSI ---- */
  .psi-lead{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:center;margin-bottom:28px}
  .psi-badge{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--stable);
    border-radius:10px;padding:26px}
  .psi-badge .v{font-size:40px;font-weight:400;color:var(--ink)}
  .psi-badge .l{font-family:-apple-system,sans-serif;font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mist);margin-top:6px}
  .psi-badge .tag{display:inline-block;margin-top:12px;font-family:-apple-system,sans-serif;
    font-size:12px;font-weight:600;color:var(--stable);background:rgba(30,122,86,.1);
    padding:4px 10px;border-radius:20px}
  .bands{display:flex;gap:18px;font-family:-apple-system,sans-serif;font-size:13px;color:var(--slate)}
  .bands .b{display:flex;align-items:center;gap:7px}
  .dot{width:11px;height:11px;border-radius:50%}
  .barlist{display:flex;flex-direction:column;gap:9px;font-family:-apple-system,sans-serif}
  .barrow{display:grid;grid-template-columns:170px 1fr 52px;align-items:center;gap:12px;font-size:12.5px}
  .barrow .fn{color:var(--slate);text-align:right;font-family:var(--mono);font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .barrow .track{background:var(--line);border-radius:4px;height:16px;overflow:hidden}
  .barrow .fill{height:100%;border-radius:4px}
  .barrow .pv{font-family:var(--mono);font-size:11.5px;color:var(--ink);text-align:right}

  /* ---- Subgroups ---- */
  .sg{display:flex;align-items:flex-end;gap:10px;height:210px;padding-top:8px}
  .sg .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .sg .bar{width:70%;background:var(--ink-2);border-radius:5px 5px 0 0;transition:height .8s ease}
  .sg .bar.weak{background:var(--cost)}
  .sg .v{font-family:var(--mono);font-size:11px;color:var(--slate);margin-bottom:6px}
  .sg .l{font-family:-apple-system,sans-serif;font-size:12px;color:var(--slate);margin-top:8px}

  .callout{background:var(--ink);color:#fff;border-radius:10px;padding:24px 28px;margin-top:28px;
    font-family:-apple-system,sans-serif;font-size:15px;line-height:1.6}
  .callout b{color:var(--accent)}

  /* ---- Threshold slider ---- */
  .thr-wrap{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;margin-top:8px}
  .thr-top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px}
  .thr-top .box{background:var(--card);padding:18px 20px;text-align:center}
  .thr-top .box .v{font-family:Georgia,serif;font-size:28px;color:var(--ink)}
  .thr-top .box .l{font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--mist);margin-top:6px}
  .slider-row{display:flex;align-items:center;gap:18px;margin:8px 0 6px}
  .slider-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;
    border-radius:3px;background:linear-gradient(to right,var(--gain),var(--accent),var(--cost));outline:none}
  .slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
  .slider-row input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:var(--ink);border:3px solid #fff;cursor:pointer}
  .thr-val{font-family:Georgia,serif;font-size:24px;color:var(--ink);min-width:64px;text-align:center}
  .thr-marks{display:flex;justify-content:space-between;font-family:-apple-system,sans-serif;
    font-size:11.5px;color:var(--slate);margin-top:2px}
  .thr-marks b{color:var(--accent)}
  .thr-cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin-top:24px;font-family:-apple-system,sans-serif}
  .thr-cm .axis{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mist);
    display:flex;align-items:center;justify-content:center;text-align:center}
  .thr-cm .cell{border-radius:8px;padding:16px 12px;text-align:center;color:#fff;transition:background .3s}
  .thr-cm .cell .cn{font-size:23px;font-weight:600;font-family:Georgia,serif}
  .thr-cm .cell .ct{font-size:11px;opacity:.92;margin-top:5px;line-height:1.3}
  .thr-cm .rowlab{font-size:12px;color:var(--slate);display:flex;align-items:center;
    justify-content:flex-end;padding-right:10px;text-align:right;font-weight:600}

  /* ---- Methodology ---- */
  .method{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;font-family:-apple-system,sans-serif}
  .method .m{border-top:1px solid var(--line);padding-top:16px}
  .method .m h4{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .method .m p{font-size:13.5px;color:var(--slate);line-height:1.6}

  footer{background:var(--ink);color:#B9C7DA;padding:48px 0;
    font-family:-apple-system,sans-serif;font-size:14px}
  footer a{color:var(--accent);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .foot-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;align-items:center}

  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
    .psi-lead{grid-template-columns:1fr}
    .method{grid-template-columns:1fr}
    .barrow{grid-template-columns:120px 1fr 46px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function wireThreshold(){
  const slider=document.getElementById('thr-slider'); if(!slider) return;
  const curve=DATA.thresholdCurve;
  const find=(t)=> curve.reduce((a,b)=> Math.abs(b.t-t)<Math.abs(a.t-t)?b:a);
  const fmtDollarM=(v)=>`$${(v/1e6).toFixed(1)}M`;
  function update(){
    const t=parseInt(slider.value,10)/100;
    const r=find(t);
    document.getElementById('thr-tval').textContent=t.toFixed(2);
    document.getElementById('thr-profit').textContent=fmtDollarM(r.profit);
    document.getElementById('thr-appr').textContent=r.approval_rate.toFixed(1)+'%';
    document.getElementById('thr-def').textContent=r.default_approved.toFixed(1)+'%';
    document.querySelector('#c-tp .cn').textContent=r.TP.toLocaleString('en-US');
    document.querySelector('#c-fp .cn').textContent=r.FP.toLocaleString('en-US');
    document.querySelector('#c-fn .cn').textContent=r.FN.toLocaleString('en-US');
    document.querySelector('#c-tn .cn').textContent=r.TN.toLocaleString('en-US');
    // color intensity by cell magnitude within its row semantic (good=green, bad=red already)
  }
  slider.addEventListener('input',update);
  update();
}

        "All vintages. 31 features read as unstable — but they share the same ~3.9 PSI, the fingerprint of the vanishing −1 sentinel, not genuine drift.")}
      ${psiCard("Clean view (post-2012) — the real picture", DATA.psiClean, 0.6, DATA.psiBandsClean,
        "Baseline restricted to post-2012 vintages. Only initial_list_status and verification_status truly shift — both documented policy changes, not model failure.")}
    </div>
  </div></section>`);
  return s;
}

function psiCard(title, rows, scale, bands, note){
  const bandColor = (v)=> v<0.1?'var(--stable)':(v<0.25?'var(--watch)':'var(--unstable)');
  const barsHtml = rows.map(([f,v])=>`
    <div class="barrow">
      <div class="fn" title="${f}">${f}</div>
      <div class="track"><div class="fill" data-w="${Math.min(100,(v/scale)*100)}"
        style="width:0;background:${bandColor(v)}"></div></div>
      <div class="pv">${v.toFixed(v<0.1?3:2)}</div>
    </div>`).join('');
  return `<div class="card">
    <h3>${title}</h3>
    <p class="note">${note}</p>
    <div class="barlist">${barsHtml}</div>
    <div style="font-family:-apple-system,sans-serif;font-size:12px;color:var(--mist);
      margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      ${bands.stable} stable · ${bands.watch} watch · ${bands.unstable} unstable</div>
  </div>`;
}

/* ---------------- LIMITS ---------------- */
function limitsSection(){
  const s=$(`<section id="limits"><div class="wrap">
    <div class="sec-head"><span class="sec-num">05</span><h2>Where the model is weakest</h2></div>
    <p class="sec-sub">Reported directly, not smoothed into an aggregate. The model discriminates
    worst exactly where a lender would most want precision: the highest-risk grades and the
    lowest-income borrowers.</p>
    <div class="grid2">
      <div class="card"><h3>AUC by credit grade</h3>
        <p class="note">Falls from 0.65 (grade A) toward 0.58 (grade G), even as the default rate
        climbs from 5% to 46%.</p>
        ${sgChart(DATA.grade, "grade", 4)}
      </div>
      <div class="card"><h3>AUC by income quartile</h3>
        <p class="note">Weakest in Q1 (lowest income), where borrowers default most — the reverse
        of where precision matters.</p>
        ${sgChart(DATA.income, "income", 0)}
      </div>
    </div>
    <div class="callout">
      <b>Stated up front, not buried:</b> the model estimates P(default | approved) — it never saw
      a rejected application, so it cannot serve as a first-pass underwriting filter, only as a
      second layer over an already-approved book. It is not built for live lending as-is.
    </div>
  </div></section>`);
  return s;
}

function sgChart(rows, kind, weakIdx){
  const min=0.56, max=0.71; // zoom the meaningful band
  const cols = rows.map(([l,auc],i)=>{
    const h = ((auc-min)/(max-min))*100;
    const weak = kind==="grade" && i===weakIdx;
    return `<div class="col">
      <div class="v">${auc.toFixed(3)}</div>
      <div class="bar ${weak?'weak':''}" data-h="${h.toFixed(0)}" style="height:0"></div>
      <div class="l">${l}</div></div>`;
  }).join('');
  return `<div class="sg">${cols}</div>`;
}

/* ---------------- METHOD ---------------- */
function methodSection(){
  const items=[
    ["Decision metric is profit","Expected portfolio profit, not accuracy. A bad loan costs 2.67× what a good one returns; the cutoff is chosen where the profit curve peaks."],
    ["Validation respects time","Walk-forward: train ≤2013, validate 2014, test 2015. Never a random shuffle — that would let 2015 loans inform predictions about 2011."],
    ["Leakage screened three ways","Temporal (never shuffled), target (post-origination columns dropped and confirmed by univariate AUC), and identity (borrower ID is 100% null — stated as a limit)."],
    ["Every number is reproducible","No figure is hand-typed. Each metric on this page is generated by code, written to a versioned fact sheet, and checked against a canonical source (56 automated checks)."]
  ];
  const ms = items.map(([h,p])=>`<div class="m"><h4>${h}</h4><p>${p}</p></div>`).join('');
  return $(`<section id="method"><div class="wrap">
    <div class="sec-head"><span class="sec-num">06</span><h2>How it was built</h2></div>
    <p class="sec-sub">The commitments that make the result defensible in one sentence each.</p>
    <div class="method">${ms}</div>
  </div></section>`);
}

function footer(){
  return $(`<footer><div class="wrap"><div class="foot-grid">
    <div>Credit Default Prediction · Lending Club 2007–2015 · Mateus Fardin Pavan</div>
    <div><a href="https://github.com/MateusFPavan/credit-default-prediction-lendingclub">GitHub repository</a>
    &nbsp;·&nbsp; <a href="https://www.linkedin.com/in/mateus-fardin-pavan/">LinkedIn</a></div>
  </div></div></footer>`);
}

/* ---------------- ANIMATION ---------------- */
function animate(){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      e.target.querySelectorAll('.bar[data-h]').forEach(b=>{ b.style.height=b.dataset.h+'%'; if(b.dataset.bot!==undefined) b.style.bottom=(b.dataset.bot||0)+'%'; });
      e.target.querySelectorAll('.fill[data-w]').forEach(f=>{ f.style.transition='width .9s ease'; f.style.width=f.dataset.w+'%'; });
      io.unobserve(e.target);
    });
  },{threshold:.25});
  document.querySelectorAll('section').forEach(s=>io.observe(s));
  drawPsiLine();
  drawLift();
  wireThreshold();
}

function drawLift(){
  const host=document.getElementById('liftchart'); if(!host) return;
  const data=DATA.lift, W=900,H=300,pad={l:44,r:16,t:16,b:44};
  const x=(v)=>pad.l+(v/100)*(W-pad.l-pad.r);
  const y=(v)=>pad.t+(1-v/100)*(H-pad.t-pad.b);
  const modelPath=data.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const randPath=`M${x(0)} ${y(0)} L${x(100)} ${y(100)}`;
  const grid=[0,25,50,75,100].map(v=>`
    <line x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}" stroke="#E4E9F0"/>
    <text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8FA3BC" font-family="monospace">${v}%</text>`).join('');
  const xlab=[0,25,50,75,100].map(v=>`<text x="${x(v)}" y="${H-22}" text-anchor="middle" font-size="11" fill="#8FA3BC" font-family="monospace">${v}%</text>`).join('');
  // marker at 10%
  const mx=x(10), my=y(20.7);
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"
    aria-label="Cumulative defaults captured versus applications rejected; model curve rises well above the random diagonal">
    ${grid}
    <path d="${randPath}" fill="none" stroke="#8FA3BC" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="${modelPath}" fill="none" stroke="#1E7A56" stroke-width="2.6" stroke-linejoin="round"/>
    <line x1="${mx}" y1="${y(0)}" x2="${mx}" y2="${my}" stroke="#C8912E" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="${mx}" cy="${my}" r="4" fill="#C8912E"/>
    <text x="${mx+10}" y="${my-6}" font-size="12" fill="#0E2A47" font-family="-apple-system,sans-serif" font-weight="600">20.7% of defaults</text>
    <text x="${mx+10}" y="${my+10}" font-size="11" fill="#5A7391" font-family="-apple-system,sans-serif">at 10% rejected</text>
    <text x="${W-pad.r-6}" y="${y(96)-4}" text-anchor="end" font-size="12" fill="#1E7A56" font-family="-apple-system,sans-serif" font-weight="600">Model</text>
    <text x="${W-pad.r-6}" y="${y(72)}" text-anchor="end" font-size="12" fill="#8FA3BC" font-family="-apple-system,sans-serif">Random</text>
    <text x="${(pad.l+W-pad.r)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="#5A7391" font-family="-apple-system,sans-serif">Applications rejected (riskiest first)</text>
  </svg>`;
}

function drawPsiLine(){
  const host=document.getElementById('psiline'); if(!host) return;
  const data=DATA.psiQuarterly, W=900, H=220, pad={l:38,r:16,t:16,b:44};
  const maxY=2.2;
  const x=(i)=>pad.l+(i/(data.length-1))*(W-pad.l-pad.r);
  const y=(v)=>pad.t+(1-v/maxY)*(H-pad.t-pad.b);
  const pts=data.map(([q,v],i)=>[x(i),y(v)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pad.l} ${y(0)} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${x(data.length-1)} ${y(0)} Z`;
  const gridY=[0,0.5,1,1.5,2].map(v=>`
    <line x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}" stroke="#E4E9F0" stroke-width="1"/>
    <text x="${pad.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8FA3BC" font-family="monospace">${v.toFixed(1)}</text>`).join('');
  const labels=data.map(([q],i)=> (i%4===0)?`<text x="${x(i)}" y="${H-24}" text-anchor="middle" font-size="10" fill="#8FA3BC" font-family="monospace">${q}</text>`:'').join('');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img"
    aria-label="Score PSI by quarter, declining from 2.1 in 2008 to near zero by 2013">
    ${gridY}
    <path d="${area}" fill="rgba(14,42,71,.06)"/>
    <path d="${path}" fill="none" stroke="#0E2A47" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="#0E2A47"/>`).join('')}
    ${labels}
  </svg>`;
}

render();

</script>
