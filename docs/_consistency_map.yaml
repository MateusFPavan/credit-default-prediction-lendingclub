# Cross-document consistency map. Canonical source -> consumers.
#
# type:      "single" (one fact/value expected wherever the subject is mentioned)
#            "multi"  (legitimately different scopes; no single value is checked)
# severity:  "high" (a break fails the gate) | "low" (cosmetic/historical note -> report only)
#
# How each "single" fact is checked (scripts/check_consistency.py):
#   1. topic  -- regex: does the consumer TALK about this subject anywhere?
#   2. If so, within a text window around each mention:
#        - accept -- list of EQUIVALENT correct ways to state the fact
#                    (any one is enough; no exact wording required)
#        - wrong  -- optional list of EXPLICITLY wrong forms (e.g. an old count)
#   3. If the window matches any 'wrong', OR matches no 'accept' -> divergence.
#   4. A consumer that never mentions the topic is simply not checked there --
#      "not mentioning" is not a violation.
#
# Adjustment history (each confirmed on disk before the change):
# - 2026-09-17: the first version used loose substring checks (e.g. "78" anywhere in a
#   document), which hid the expected LOW finding ("78" appeared by coincidence inside
#   "255.470.782" and "0,0878", unrelated to the feature count) and a topic that was too
#   broad ("CI") matched inside "decision", "specific", etc. Rewritten as the
#   topic+accept+wrong model above, with every pattern tested against each consumer's
#   real text before it was fixed in the map.
# - 2026-09-30: ri_79_features_historic RESOLVED. "79" described the size of the
#   FEATURE_SET list when the experiment ran; application_type left it later without ever
#   having contributed a column, so the artifact Phase 2a loaded (models/xgb_final.joblib,
#   90 columns) is the same as today's. "78" is true of the current model and of the
#   experiment. The fact stays as a regression guard.
# - maturity_cutoff: the literal phrase "Dec/2015...Dec/2013" appears only in
#   technical_report.md; DATA_CARD.md and DIMENSIONAL_MODEL.md never quote it, they only
#   inherit the numeric CONSEQUENCE of the rule. The fact checks that consequence instead
#   (the final population, 673,314), which all three share.
# - 2026-10-02: the reject-inference write-up moved to docs/reject_inference.md; the two
#   RI facts and the profit headline now check it.
facts:
  - name: feature_count
    source: src/data.py            # FEATURE_SET / CATEGORICAL_COLS
    type: single
    severity: high
    consumers: [README.md, docs/MODEL_CARD.md, docs/technical_report.md]
    topic: '\d+ named features'
    accept: ['78 named features']
    wrong: ['79 named features']

  - name: profit_headline
    source: docs/FACTS.md
    type: single
    severity: high
    consumers: [README.md, docs/MODEL_CARD.md, docs/SETUP.md, docs/technical_report.md, CHANGELOG.md, docs/reject_inference.md]
    topic: '242,2\d{2},\d{3}'
    accept: ['242,230,710\.89']

  - name: maturity_cutoff
    source: docs/scope.md
    type: single
    severity: high
    consumers: [docs/DATA_CARD.md, docs/technical_report.md, docs/DIMENSIONAL_MODEL.md]
    topic: '673,3\d{2}'
    accept: ['673,314']
    note: "checks the FINAL POPULATION (numeric consequence of the cutoff), not the phrase Dec/2015...Dec/2013 -- see the adjustment history above"

  - name: ci_pipeline
    source: .github/workflows/docker.yml
    type: single
    severity: high
    consumers: [README.md, docs/MODEL_CARD.md, docs/SETUP.md]
    topic: 'smoke-test'
    accept: ['unit-tests', 'unit tests', 'pytest tests', '146 tests', 'test suite', 'only if that passes']
    note: "accepts equivalent forms -- the fact is 'tests run before the build', not the exact word 'unit-tests'"

  - name: calibration_metrics
    source: docs/MODEL_CARD.md
    type: multi          # legitimately different scopes (full vs half) -- do NOT check a single value
    severity: low
    note: "bias/Brier have 2 legitimate scopes (full test set vs half of it, calibration experiment). Not a divergence."

  - name: thin_model_auc
    source: docs/reject_inference.md
    type: single
    severity: low        # RI thesis section, not a headline number
    consumers: [README.md, docs/reject_inference.md]
    topic: '0\.56\d{2}'
    accept: ['0\.5620']

  - name: ri_79_features_historic
    source: src/data.py
    type: single
    severity: low         # historical note, kept as a regression guard -- does not block
    consumers: [docs/reject_inference.md]
    topic: 'XGB [0-9]+ features|[0-9]+ features vs thin'
    accept: ['78 features']
    wrong: ['79 features']
    note: "resolved 2026-09-30 (see the adjustment history at the top). Kept as a guard: if 79 comes back, it is a regression. Separate from feature_count because one fact name cannot carry two severities"
